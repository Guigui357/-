name: Build Jailbreak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install ldid
      run: brew install ldid
    - name: Compile
      run: |
        mkdir -p JailbreakApp.app
        xcrun --sdk iphoneos clang -arch arm64e \
          -framework UIKit -framework Foundation \
          -framework IOKit -framework CoreFoundation \
          -o JailbreakApp.app/JailbreakApp \
          main.m AppDelegate.m ViewController.m exploit.c \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -Wno-implicit-function-declaration -Wno-deprecated-declarations -fobjc-arc
    - name: Create Info.plist
      run: |
        cat > JailbreakApp.app/Info.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>JailbreakApp</string>
            <key>CFBundleIdentifier</key>
            <string>com.jailbreak</string>
            <key>CFBundleName</key>
            <string>Jailbreak</string>
            <key>CFBundleVersion</key>
            <string>1.0</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UIRequiredDeviceCapabilities</key>
            <array><string>arm64e</string></array>
        </dict>
        </plist>
        EOF
    - name: Create Entitlements
      run: |
        cat > Entitlements.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>com.apple.private.security.no-container</key>
            <true/>
            <key>task_for_pid-allow</key>
            <true/>
            <key>platform-application</key>
            <true/>
        </dict>
        </plist>
        EOF
    - name: Sign
      run: ldid -SEntitlements.plist JailbreakApp.app/JailbreakApp
    - name: Package
      run: |
        mkdir Payload
        cp -r JailbreakApp.app Payload/
        zip -r Jailbreak.ipa Payload
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: Jailbreak.ipa
        path: Jailbreak.ipa
